name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Run the contract tests in Docker
        run: bash ./tests/run-docker.sh
      - name: Build the firmware, guard and runtime suites against ZMK in Docker
        run: bash ./tests/run-integration-docker.sh

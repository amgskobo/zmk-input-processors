description: Converts absolute pointer coordinates into relative motion, smoothed over two samples

compatible: "zmk,input-processor-absolute-to-relative"

include: ip_zero_param.yaml

properties:
  suppress-btn-touch:
    description: >-
      If true, the input processor will suppress INPUT_BTN_TOUCH events (used
      to control touch state) so they are not forwarded to downstream
      consumers.
    type: boolean
  suppress-btn0:
    description: >-
      If true, the input processor will suppress INPUT_BTN_0 events so they
      are not forwarded to downstream consumers.
    type: boolean
  setting-name:
    type: string
    description: >-
      Short name for this instance in custom settings keys, in place of its
      devicetree instance number. A board routes several instances of this
      processor, and in a client they are otherwise identically named rows told
      apart only by a number whose order comes from however devicetree happened
      to enumerate the nodes. The whole key is capped at 48 bytes.
